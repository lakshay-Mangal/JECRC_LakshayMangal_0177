<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Box Event</title>

<style>

body{
    font-family:Arial;
    margin:40px;
}

input{
    padding:10px;
    width:250px;
    font-size:14px;
}

</style>

</head>

<body>

<h2>Product Search</h2>

<input type="text" id="searchBox" placeholder="Search product">

<script>

document.getElementById("searchBox").addEventListener("keydown", (e) => {

    if(e.key === "Enter"){

        console.log("Search triggered");

        alert("Searching product...");

    }

});

</script>

</body>
</html>
