<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JavaScript Arrow Functions Demo</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:40px;
    background:#f4f6f8;
}

h1{
    color:#333;
}

button{
    padding:10px 20px;
    font-size:16px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.result-box{
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

ul{
    margin-top:10px;
}
</style>

</head>

<body>
    <h1>JS Arrow function and Array Methods</h1>
    <p> Click the button to run different JS function </p>

    <button id ="runBtn"> Run JavaScript Operation</button>
    <div class="Result-Box">
        <h3> Result</h3>
        <ul id="output"></ul>
    </div>
    <script>
        const Numbers= [1,2,3,4,5];
        const People = [
        {Name: "Alice", age:25},
        {Name: "Bob", age:26},
        {Name: "Cat", age:21}
        ]
        const runBtn= document.getElementById('runBtn');
        const output= document.getElementById('output');
        //Map Function
        const squareNumbers=  Numbers.map(num=>num*num);

        //FILTER Function
        const adults=  People.filter(person=> person.age>=18);

        //REDUCE Function
        const totalAge= People.reduce((sum,person)=> sum+person.age,0);

        runBtn.addEventListener('click', ()=>{
            //Clear previous results
            output.innerHTML='';
            //Display Squared numbers
            const squaredList= document.createElement('li');
            squaredList.textContent= 'Squared Numbers: ' +squareNumbers.join(',');
            output.appendChild(squaredList);
            //Display adults
            const adultsList= document.createElement('li');
            adultsList.textContent= 'Adults '+adults.map(person=>person.Name).join(',');
            output.appendChild(adultsList);

            //Displau total age
            const totalAgeList= document.createElement('li');
            totalAgeList.textContent='Total Age:'+totalAge;
            output.appendChild(totalAgeList);

        })
    </script>
    </body>
