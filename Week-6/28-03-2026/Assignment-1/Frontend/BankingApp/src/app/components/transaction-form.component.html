<!-- Modal Overlay -->
<div class="modal-overlay" (click)="onCancel()"></div>

<div class="modal-panel">
  <div class="modal-header">
    <h2 class="modal-title">{{ isEdit ? 'Edit Transaction' : 'New Transaction' }}</h2>
    <button class="close-btn" (click)="onCancel()">&#10005;</button>
  </div>

  <div class="modal-body">
    <div class="alert-error" *ngIf="formError">{{ formError }}</div>

    <div class="form-row">
      <div class="form-group">
        <label>Date <span class="required">*</span></label>
        <input type="date" [(ngModel)]="form.date" class="form-input" />
      </div>
      <div class="form-group">
        <label>Type <span class="required">*</span></label>
        <select [(ngModel)]="form.type" class="form-input">
          <option [value]="0">Credit</option>
          <option [value]="1">Debit</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Description <span class="required">*</span></label>
      <input
        type="text"
        [(ngModel)]="form.description"
        placeholder="e.g. AMAZON.COM PURCHASE"
        class="form-input"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Amount ($) <span class="required">*</span></label>
        <input
          type="number"
          [(ngModel)]="form.amount"
          min="0.01"
          step="0.01"
          placeholder="0.00"
          class="form-input"
        />
      </div>
      <div class="form-group">
        <label>Balance after</label>
        <input
          type="text"
          [(ngModel)]="form.balance"
          placeholder="$0.00"
          class="form-input"
        />
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-cancel" (click)="onCancel()">Cancel</button>
    <button
      class="btn btn-save"
      [class.btn-edit]="isEdit"
      (click)="onSubmit()"
    >
      {{ isEdit ? 'Save Changes' : 'Add Transaction' }}
    </button>
  </div>
</div>
