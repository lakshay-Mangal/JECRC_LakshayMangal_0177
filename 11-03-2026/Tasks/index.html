<!DOCTYPE html>
<html>
<head>
<title>JavaScript Array Methods Demo</title>

<style>

body{
font-family: Arial;
background:#f4f6f9;
padding:40px;
}

.container{
width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
margin:8px 0;
padding:8px 15px;
cursor:pointer;
}

.result{
margin-bottom:20px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>JavaScript Array Methods Demo</h2>

<button onclick="addMarks()">Map → Add 5 Marks</button>
<p id="mapResult" class="result"></p>

<button onclick="filterOrders()">Filter → Orders > 1000</button>
<p id="filterOrderResult" class="result"></p>

<button onclick="calculateTotal()">Reduce → Total Price</button>
<p id="reduceResult" class="result"></p>

<button onclick="applyDiscount()">Map → Apply 10% Discount</button>
<p id="discountResult" class="result"></p>

<button onclick="findPassing()">Filter → Passing Students</button>
<p id="passingResult" class="result"></p>

</div>

<script>

function addMarks(){

var marks = [65,70,80,55,90];

var updatedMarks = marks.map(m => m + 5);

document.getElementById("mapResult").innerHTML =
"Original: " + marks + "<br>Updated: " + updatedMarks;

}

function filterOrders(){

var ordersAmount = [800,1000,1200,1100,3000,1500,900];

var highOrders = ordersAmount.filter(order => order > 1000);

document.getElementById("filterOrderResult").innerHTML =
"Orders: " + ordersAmount + "<br>High Orders: " + highOrders;

}

function calculateTotal(){

var prices = [300,300,400,1000,600,400,550,450];

var total = prices.reduce((sum, price) => sum + price, 0);

document.getElementById("reduceResult").innerHTML =
"Prices: " + prices + "<br>Total Price: " + total;

}

function applyDiscount(){

var prices = [1200,800,1500,2000];

var discounted = prices.map(p => p * 0.9);

document.getElementById("discountResult").innerHTML =
"Original: " + prices + "<br>Discounted: " + discounted;

}

function findPassing(){

var marks = [40,49,67,90,55,18];

var passing = marks.filter(m => m > 50);

document.getElementById("passingResult").innerHTML =
"Marks: " + marks + "<br>Passing: " + passing;

}

</script>

</body>
</html>
